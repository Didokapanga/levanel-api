services:
  postgres:
    image: postgres:17-alpine
    container_name: levannel-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Dido@1234
      POSTGRES_DB: levannel_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: levannel-api

    ports:
      - "5000:5000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - postgres

volumes:
  postgres_data: